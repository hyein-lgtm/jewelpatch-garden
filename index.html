<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>주얼패치 가든 팝업 | WBL</title>
<meta name="description" content="피어싱 없이 귀에 붙이는 WBL 이혈테라피 주얼패치 48종을 스타일별로 걸어보며 구경하는 3D 온라인 팝업스토어.">
<meta property="og:type" content="website">
<meta property="og:title" content="주얼패치 가든 팝업 | WBL">
<meta property="og:description" content="진주, 플라워, 하트·리본, 나비·별… 8가지 스타일 받침대 사이를 걸으며 주얼패치를 구경해보세요.">
<meta name="theme-color" content="#3A2236">
<style>html,body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: full-screen 3D jewel plaza at dusk; five lit pedestals, one shop bar at the bottom, one product sheet. Single deliberate look. */
:root{
  --ivory:#FBF7F1; --ivory-2:#F3EBE3; --rose:#C48A8F; --rose-deep:#8E5A60; --plum:#4E2338; --ink:#3E2830;
  --gold:#C9A45C; --gold-soft:#E9D3A3; --muted:#8C7A77; --line:rgba(62,40,48,.12); --glass:rgba(251,247,241,.88);
  --sale:#C2475A;
  --f-display:"Gowun Batang","Nanum Myeongjo",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{word-break:keep-all;background:#3A2236;color:var(--ink);font-family:var(--f-body);font-size:14px;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#scene{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none;outline:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.won{font-variant-numeric:tabular-nums}

.hud-top{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;z-index:5;pointer-events:none;
  padding-top:calc(12px + env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{pointer-events:auto;color:var(--ivory);text-shadow:0 1px 10px rgba(40,10,30,.5)}
.brand span{display:block;font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold-soft)}
.brand b{display:block;font-family:var(--f-display);font-size:20px;font-weight:700;margin-top:2px}
.tr{display:flex;gap:8px;pointer-events:auto;flex-wrap:wrap;justify-content:flex-end}
.chip{background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:12.5px;display:flex;align-items:center;gap:7px;white-space:nowrap}
.chip .dot{width:7px;height:7px;border-radius:50%;background:#B7A8A6}
.chip.live .dot{background:#6FB27A;box-shadow:0 0 0 3px rgba(111,178,122,.25)}
.shopbtn{background:var(--plum);color:var(--ivory);border:1px solid rgba(233,211,163,.5);font-weight:600}
.shopbtn svg{width:15px;height:15px}

.bar{position:fixed;left:50%;transform:translateX(-50%);z-index:6;width:min(440px,calc(100% - 32px));bottom:calc(150px + env(safe-area-inset-bottom,0px));
  display:grid;grid-template-columns:minmax(0,1fr) auto;padding-left:16px!important;gap:12px;align-items:center;background:var(--ivory);border-radius:18px;padding:10px 10px 10px 10px;
  box-shadow:0 14px 40px rgba(40,10,30,.35),0 0 0 1px rgba(201,164,92,.45);animation:pop .28s cubic-bezier(.2,.9,.3,1.2)}
@media (hover:hover) and (pointer:fine){.bar{bottom:calc(28px + env(safe-area-inset-bottom,0px))}}
@keyframes pop{from{transform:translate(-50%,14px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.bar .th{width:62px;height:62px;border-radius:12px;background:radial-gradient(circle at 50% 40%,#fff,#F1E6DB);display:grid;place-items:center;overflow:hidden;border:0;padding:0}
.bar .th img{max-width:56px;max-height:58px;object-fit:contain}
.bar .nm{min-width:0}
.bar .nm b{display:block;font-family:var(--f-display);font-size:16.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .nm small{display:block;font-size:11px;color:var(--muted);margin-bottom:1px}
.pr{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.pr em{font-style:normal;color:var(--sale);font-weight:600;font-size:13px}
.pr strong{font-size:15px}
.pr s{font-size:11.5px;color:var(--muted)}
.watch{font-size:11px;color:var(--rose-deep);margin-top:2px}
.bar .acts{display:flex;flex-direction:column;gap:6px}
.buy{display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;background:linear-gradient(135deg,#5E2A43,#3E1C2E);color:var(--ivory);border-radius:12px;padding:11px 14px;font-weight:600;font-size:13.5px;white-space:nowrap;
  box-shadow:inset 0 0 0 1px rgba(233,211,163,.55)}
.buy:hover{filter:brightness(1.12)}
.more{border:0;background:var(--ivory-2);border-radius:10px;padding:7px 10px;font-size:12px;font-weight:600}

.joy{position:fixed;left:max(22px,calc(env(safe-area-inset-left,0px) + 14px));bottom:calc(26px + env(safe-area-inset-bottom,0px));width:108px;height:108px;border-radius:50%;
  background:rgba(251,247,241,.18);border:1.5px solid rgba(233,211,163,.7);z-index:5;touch-action:none}
.joy i{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:var(--ivory);box-shadow:0 4px 12px rgba(40,10,30,.35)}
@media (hover:hover) and (pointer:fine){.joy{display:none}}
.heart{position:fixed;right:max(18px,calc(env(safe-area-inset-right,0px) + 12px));bottom:calc(40px + env(safe-area-inset-bottom,0px));z-index:5;width:54px;height:54px;border-radius:50%;
  border:1px solid rgba(233,211,163,.6);background:var(--glass);display:grid;place-items:center}
.heart svg{width:24px;height:24px}
.keys{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:4;font-size:11.5px;color:var(--ivory);opacity:.85}
@media (hover:none),(pointer:coarse){.keys{display:none}}

.toast{position:fixed;left:50%;top:calc(80px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:9;background:var(--ivory);border-radius:12px;padding:9px 14px;font-size:13px;box-shadow:0 8px 24px rgba(40,10,30,.25);transition:opacity .3s;max-width:calc(100% - 32px);text-align:center}

.sheet{position:fixed;left:0;right:0;bottom:0;z-index:8;display:flex;justify-content:center;pointer-events:none}
.sheet-in{pointer-events:auto;width:100%;max-width:600px;max-height:80%;max-height:80dvh;overflow:auto;background:var(--ivory);border-radius:22px 22px 0 0;box-shadow:0 -10px 40px rgba(40,10,30,.35);
  padding-block:6px calc(22px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));animation:up .32s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:38px;height:4px;border-radius:4px;background:var(--line);margin:4px auto 10px}
.sh-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
.eyebrow{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--rose-deep);font-weight:600}
.sh-head h2{font-family:var(--f-display);font-size:24px;margin:3px 0 0;text-wrap:balance;font-weight:700}
.x{border:0;background:var(--ivory-2);width:34px;height:34px;border-radius:50%;flex:none;font-size:18px;line-height:1}
.note{font-size:11.5px;color:var(--muted);line-height:1.55;margin:12px 0 0}

.pd{display:grid;grid-template-columns:minmax(0,200px) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:460px){.pd{grid-template-columns:minmax(0,120px) minmax(0,1fr);gap:14px}}
.pd-img{border-radius:16px;background:radial-gradient(circle at 50% 38%,#fff,#F1E6DB 70%);display:grid;place-items:center;padding:14px;min-height:200px;box-shadow:inset 0 0 0 1px rgba(201,164,92,.35)}
.pd-img img{max-width:100%;max-height:300px;object-fit:contain}
.pd-img.tall img{max-height:340px}
.pd-img svg{width:80%;height:auto}
.pd p{line-height:1.65;margin:8px 0 10px;max-width:60ch}
.pd .pr strong{font-size:22px}
.pd .pr em{font-size:16px}
.pd .pr s{font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 14px}
.chips span{display:flex;align-items:center;gap:5px;font-size:12px;background:var(--ivory-2);border-radius:999px;padding:3px 10px 3px 3px}
.chips img{width:24px;height:24px;object-fit:contain;background:#fff;border-radius:50%}
.pd .buy{width:100%;box-sizing:border-box;padding:14px;font-size:15px}

.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:0 0 14px;scrollbar-width:none;position:sticky;top:-6px;background:var(--ivory);z-index:2;padding-top:6px}
.tabs button{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:12.5px;display:flex;gap:5px;align-items:center}
.tabs button span{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.tabs button[aria-selected="true"]{background:var(--plum);color:var(--ivory);border-color:var(--plum)}
.tabs button[aria-selected="true"] span{color:var(--gold-soft)}
.grp{margin-bottom:22px}
.gh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.gh .dot{width:12px;height:12px;border-radius:50%;box-shadow:0 0 0 2px #fff,0 0 0 3px var(--gold)}
.gh h3{font-family:var(--f-display);font-size:19px;margin:0}
.gh small{font-size:11.5px;color:var(--muted);letter-spacing:.04em}
.gd{font-size:13px;color:var(--muted);margin:4px 0 10px;line-height:1.55}
.list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:460px){.list{grid-template-columns:repeat(2,minmax(0,1fr))}}
.item{border:1px solid var(--line);border-radius:14px;background:#fff;padding:8px;display:flex;flex-direction:column;gap:5px;min-width:0}
.item .im{display:block;border-radius:10px;overflow:hidden;aspect-ratio:150/193;max-width:100%;background:#F3EAE1}
.item .im img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
.item .im:hover img{transform:scale(1.04)}
.item .tag{align-self:flex-start;font-size:10px;color:var(--rose-deep);background:#FBEDEE;border-radius:6px;padding:1px 6px}
.item b{font-family:var(--f-display);font-size:14px;line-height:1.35}
.item .pr strong{font-size:14px}.item .pr em{font-size:12px}.item .pr s{font-size:11px}
.item .buy{padding:8px 10px;font-size:12.5px;margin-top:auto}
.go-ped{margin-top:10px;width:100%}
.strip{display:flex;gap:4px;margin:6px 0 2px}
.strip img{width:30px;height:39px;object-fit:cover;border-radius:5px;box-shadow:0 0 0 1px rgba(201,164,92,.5)}
.bar .buy{border:0;font:inherit;font-weight:600;cursor:pointer}

.entry{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,rgba(78,35,56,.25),rgba(40,15,30,.65));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.entry-card{width:100%;max-width:380px;background:var(--ivory);border-radius:22px;padding:22px 20px 20px;box-shadow:0 20px 60px rgba(30,5,20,.45),0 0 0 1px rgba(201,164,92,.5)}
.entry-card h1{font-family:var(--f-display);font-size:28px;margin:6px 0 6px;line-height:1.25;text-wrap:balance}
.entry-card p{font-size:13.5px;line-height:1.6;color:var(--muted);margin:0 0 16px}
.entry-card label{font-size:12px;font-weight:600;display:block;margin-bottom:6px}
.entry-card input{width:100%;box-sizing:border-box;border:1.5px solid var(--line);border-radius:12px;padding:12px;font:inherit;font-size:15px;background:#fff;margin-bottom:14px}
.sw{display:flex;gap:10px;margin-bottom:18px}
.sw button{width:36px;height:36px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px var(--line)}
.sw button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.go{width:100%;border:0;border-radius:12px;padding:14px;font-weight:600;font-size:15px;color:var(--ivory);background:linear-gradient(135deg,#5E2A43,#3E1C2E)}
.skip{display:block;width:100%;margin-top:8px;border:0;background:none;font-size:12.5px;color:var(--rose-deep);text-decoration:underline;padding:6px}
@media (prefers-reduced-motion:reduce){.sheet-in,.bar{animation:none}}
</style>

</head>
<body>
<canvas id="scene" tabindex="0" aria-label="주얼패치 정원 3D 공간"></canvas>

<div class="hud-top">
  <div class="brand"><span>WBL · Jewelpatch Garden</span><b>주얼패치 정원 팝업</b></div>
  <div class="tr">
    <div class="chip" id="vis"><span class="dot"></span><span id="visTxt">혼자 둘러보는 중</span></div>
    <button class="chip shopbtn" id="shopBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 8h14l-1.2 11.2a1 1 0 0 1-1 .8H7.2a1 1 0 0 1-1-.8z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg>전체 주얼패치</button>
  </div>
</div>

<div class="bar" id="bar" hidden></div>
<div class="joy" id="joy" aria-hidden="true"><i id="knob"></i></div>
<button class="heart" id="heartBtn" aria-label="하트 보내기"><svg viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.6a4.3 4.3 0 0 1 7.5 2.7c0 5.6-7.5 10.2-7.5 10.2z" fill="#C2475A"/></svg></button>
<div class="keys">이동 WASD · 방향키 · 바닥 클릭 &nbsp;|&nbsp; 시점 드래그 &nbsp;|&nbsp; 모아보기 E</div>
<div class="toast" id="toast" hidden></div>
<div class="sheet" id="sheet" hidden><div class="sheet-in" id="sheetIn" role="dialog" aria-modal="false"></div></div>

<div class="entry" id="entry">
  <form class="entry-card" id="entryForm">
    <div class="eyebrow">Online Pop-up · 14 Years of Jewelry</div>
    <h1>스타일별로 걸어보는 주얼패치 정원</h1>
    <p>공식몰의 이혈테라피 주얼패치 48종을 진주, 플라워, 하트·리본, 나비·별 같은 8가지 스타일 받침대에 나눠 진열했어요. 받침대 앞에서 모아보고 바로 구매할 수 있어요.</p>
    <label for="nick">정원에서 쓸 이름</label>
    <input id="nick" maxlength="10" placeholder="예) 반짝이는 귀" autocomplete="off">
    <label>내 캐릭터 색</label>
    <div class="sw" id="sw"></div>
    <button class="go" type="submit">정원 입장하기</button>
    <button class="skip" type="button" id="skipBtn">걷지 않고 스타일별 목록 보기</button>
  </form>
</div>

let joy={x:0,y:0,id:null};const joyEl=$('#joy'),knob=$('#knob');
joyEl.addEventListener('pointerdown',e=>{joy.id=e.pointerId;joyEl.setPointerCapture(e.pointerId);joyMove(e)});
joyEl.addEventListener('pointermove',e=>{if(e.pointerId===joy.id)joyMove(e)});
const joyEnd=e=>{if(e.pointerId!==joy.id)return;joy={x:0,y:0,id:null};knob.style.transform=''};joyEl.addEventListener('pointerup',joyEnd);joyEl.addEventListener('pointercancel',joyEnd);
function joyMove(e){const r=joyEl.getBoundingClientRect();let dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);const m=Math.hypot(dx,dy),max=r.width/2-12;if(m>max){dx*=max/m;dy*=max/m}joy.x=dx/max;joy.y=dy/max;knob.style.transform=`translate(${dx}px,${dy}px)`;target=null}
let target=null;const ray=new THREE.Raycaster();const ndc=new THREE.Vector2();let drag=null;
canvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,yaw:camYaw,pitch:camPitch,moved:false,id:e.pointerId};canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>6)drag.moved=true;if(drag.moved){camYaw=drag.yaw-dx*0.006;camPitch=Math.min(1.0,Math.max(0.1,drag.pitch+dy*0.004))}});
canvas.addEventListener('pointerup',e=>{if(!drag||e.pointerId!==drag.id)return;const d=drag;drag=null;if(d.moved||!entered)return;
  const r=canvas.getBoundingClientRect();ndc.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1);ray.setFromCamera(ndc,camera);
  const h=ray.intersectObjects(hitMeshes,false)[0];
  if(h){const pd=PEDS.find(q=>q.p.id===h.object.userData.pid);if(Math.hypot(P.x-pd.x,P.z-pd.z)<3.6){openProduct(pd.p.id);return}walkTo(pd);return}
  const f=ray.intersectObject(floor,false)[0];if(f)target={x:f.point.x,z:f.point.z}});
canvas.addEventListener('pointercancel',()=>{drag=null});
function walkTo(pd){const l=Math.hypot(pd.x,pd.z)||1;target={x:pd.x-pd.x/l*2.6,z:pd.z-pd.z/l*2.6}}

function resolve(){for(const o of obstacles){const dx=P.x-o.x,dz=P.z-o.z,d=Math.hypot(dx,dz),m=o.r+0.4;if(d<m&&d>1e-4){P.x=o.x+dx/d*m;P.z=o.z+dz/d*m}}const d=Math.hypot(P.x,P.z);if(d>21.2){P.x*=21.2/d;P.z*=21.2/d}}

let near=null;
function watchers(id){let n=0;others.forEach(o=>{if(o.v===id)n++});return n}
function renderBar(){const b=$('#bar');if(!near||!entered||!$('#sheet').hidden){b.hidden=true;return}const st=near.p;const list=byStyle(st.id);const w=watchers(st.id);
  const lo=Math.min(...list.map(x=>x.sell));
  b.innerHTML=`<div class="nm"><small>${st.en} · ${list.length}종</small><b>${st.name}</b><div class="strip">${list.slice(0,6).map(x=>`<img src="${x.th}" alt="">`).join('')}</div>${w?`<div class="watch">지금 ${w}명이 같이 보고 있어요</div>`:`<div class="watch">${won(lo)}부터</div>`}</div>
  <div class="acts"><button class="buy" id="barOpen">모아보기</button></div>`;
  b.hidden=false;$('#barOpen').onclick=()=>openProduct(st.id)}
let barKey='';
function updateNear(){let best=null,bd=1e9;for(const pd of PEDS){const d=Math.hypot(P.x-pd.x,P.z-pd.z);if(d<bd){bd=d;best=pd}}const nn=bd<3.9?best:null;
  if(nn!==near){near=nn;if(nn&&entered)burst(nn.x,2.6,nn.z)}
  const key=(near?near.p.id:'')+'|'+(near?watchers(near.p.id):0)+'|'+$('#sheet').hidden+'|'+entered;if(key!==barKey){barKey=key;renderBar()}}

function frame(){
  const dt=Math.min(clock.getDelta(),0.05),t=clock.elapsedTime;let mx=0,mz=0;
  if(entered&&$('#sheet').hidden){const kf=(keys['w']||keys['arrowup']?1:0)-(keys['s']||keys['arrowdown']?1:0),kr=(keys['d']||keys['arrowright']?1:0)-(keys['a']||keys['arrowleft']?1:0);const f=kf-joy.y,r=kr+joy.x;
    if(f||r){target=null;const fx=-Math.sin(camYaw),fz=-Math.cos(camYaw),rx=Math.cos(camYaw),rz=-Math.sin(camYaw);mx=fx*f+rx*r;mz=fz*f+rz*r;const m=Math.hypot(mx,mz);if(m>1){mx/=m;mz/=m}}
    else if(target){const dx=target.x-P.x,dz=target.z-P.z,d=Math.hypot(dx,dz);if(d<0.25)target=null;else{mx=dx/d;mz=dz/d}}}
  const moving=Math.hypot(mx,mz)>0.05;
  if(moving){P.x+=mx*4.6*dt;P.z+=mz*4.6*dt;let dr=Math.atan2(mx,mz)-P.ry;dr=Math.atan2(Math.sin(dr),Math.cos(dr));P.ry+=dr*Math.min(1,dt*12);resolve()}
  if(player){player.position.set(P.x,0,P.z);player.rotation.y=P.ry;animAvatar(player,moving,dt)}
  updateNear();
  const cd=entered?8.2:16,cx=P.x+Math.sin(camYaw)*Math.cos(camPitch)*cd,cz=P.z+Math.cos(camYaw)*Math.cos(camPitch)*cd,cy=1.4+Math.sin(camPitch)*cd+(entered?0:2);
  camera.position.lerp(new THREE.Vector3(cx,cy,cz),Math.min(1,dt*(entered?7:1.5)));camera.lookAt(P.x,entered?2.4:3,entered?P.z:P.z-6);
  if(!entered)camYaw=Math.sin(t*0.1)*0.35;
  ringBig.rotation.y=t*0.35;pearl.position.y=3.6+Math.sin(t*1.1)*0.08;
  orbitGems.forEach(s=>{const u=s.userData;const a=u.a+t*0.3;s.position.set(Math.cos(a)*2.7,1.2+Math.sin(t*1.5+u.ph)*0.25,Math.sin(a)*2.7)});
  PEDS.forEach(pd=>{const on=near===pd;pd.car.rotation.y=t*(on?0.12:0.28)+pd.i;pd.car.position.y=2.55+Math.sin(t*1.2+pd.i)*0.06;
    pd.glowRing.material.opacity=(on?0.7:0.32)+Math.sin(t*2.2+pd.i)*0.08;pd.beam.material.opacity=on?1:0.65;pd.crown.rotation.z=t*0.6});
  const pa=gGeo.attributes.position.array;for(let i=0;i<GN;i++){pa[i*3+1]-=gs[i]*dt*0.6;pa[i*3]+=Math.sin(t*0.7+i)*dt*0.06;if(pa[i*3+1]<0)pa[i*3+1]=12}gGeo.attributes.position.needsUpdate=true;
  if(burstT<1.2){burstT+=dt;for(let i=0;i<BN;i++){bp[i*3]+=bv[i*3]*dt;bp[i*3+1]+=bv[i*3+1]*dt;bp[i*3+2]+=bv[i*3+2]*dt;bv[i*3+1]-=2.2*dt}bGeo.attributes.position.needsUpdate=true;bMat.opacity=Math.max(0,1-burstT/1.2)}
  others.forEach(o=>{const a=o.av;const dx=o.tx-a.position.x,dz=o.tz-a.position.z;a.position.x+=dx*Math.min(1,dt*2.6);a.position.z+=dz*Math.min(1,dt*2.6);let dr=o.tr-a.rotation.y;dr=Math.atan2(Math.sin(dr),Math.cos(dr));a.rotation.y+=dr*Math.min(1,dt*10);animAvatar(a,Math.hypot(dx,dz)>0.05,dt)});
  if(ROOM&&entered&&t-lastSent>SEND_GAP){const key=[P.x.toFixed(2),P.z.toFixed(2),P.ry.toFixed(2),myHeart,near?near.p.id:''].join();if(key!==sentKey){sentKey=key;lastSent=t;sendPresence()}}
  renderer.render(scene,camera);requestAnimationFrame(frame)}
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.fov=w<h?64:52;camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

/* ---------- room ---------- */
let ROOM=null;const others=new Map();let myHeart=0;let SEND_GAP=0.9;
const SB_URL='https://qmoyqzzdhkhyogdoyvvd.supabase.co',SB_KEY='sb_publishable_FLWglxhvJRH0b3p3h3LqRg_5z0Hnrij';
function sendPresence(){if(!ROOM)return;ROOM.presence({x:+P.x.toFixed(2),z:+P.z.toFixed(2),r:+P.ry.toFixed(2),c:me.color,n:me.name.slice(0,10),h:myHeart,v:near?near.p.id:''}).catch(()=>{})}
function setVisitors(n,live){$('#vis').classList.toggle('live',!!live);$('#visTxt').textContent=live?(n>1?`지금 ${n}명 구경 중`:'지금은 나 혼자 구경 중'):'혼자 둘러보는 중'}
function onPeers(ch){const seen=new Set();let count=0;
  ch.peers.forEach(p=>{const s=p.presence||{};if(typeof s.x!=='number'||typeof s.z!=='number')return;count++;if(p.sameTab)return;seen.add(p.peer);
    let o=others.get(p.peer);const nm=String(s.n||'방문자').slice(0,10),ci=Math.abs(+s.c|0)%COLORS.length;
    if(!o||o.n!==nm||o.c!==ci){if(o)scene.remove(o.av);const av=makeAvatar(ci,nm,false);av.position.set(s.x,0,s.z);o={av,n:nm,c:ci,h:s.h};others.set(p.peer,o)}
    o.tx=Math.max(-22,Math.min(22,s.x));o.tz=Math.max(-22,Math.min(22,s.z));o.tr=+s.r||0;o.v=STYLES.some(q=>q.id===s.v)?s.v:'';
    if(s.h&&s.h!==o.h){o.h=s.h;popHeart(o.av)}});
  others.forEach((o,k)=>{if(!seen.has(k)){scene.remove(o.av);others.delete(k)}});setVisitors(Math.max(count,entered?1:0),true)}
(function(){try{if(!window.supabase||!window.supabase.createClient)return;
  const sb=window.supabase.createClient(SB_URL,SB_KEY,{realtime:{params:{eventsPerSecond:5}}});
  const myId=(crypto.randomUUID?crypto.randomUUID():String(Math.random()).slice(2)).slice(0,12);
  const ch=sb.channel('jewelpatch-garden',{config:{presence:{key:myId}}});
  ch.on('presence',{event:'sync'},()=>{const st=ch.presenceState();const peers=Object.entries(st).map(([k,arr])=>({peer:k,sameTab:k===myId,presence:arr[arr.length-1]||{}}));
    SEND_GAP=peers.length>30?3:peers.length>12?1.6:0.9;onPeers({peers})});
  ch.subscribe(st=>{if(st==='SUBSCRIBED'){ROOM={presence:o=>ch.track(o)};setVisitors(1,true);if(entered)sendPresence()}
    else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'||st==='CLOSED'){ROOM=null;setVisitors(1,false)}});
}catch(e){}})();

/* ---------- sheets ---------- */
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;t.style.opacity=1;clearTimeout(toast._t);toast._t=setTimeout(()=>{t.style.opacity=0;setTimeout(()=>t.hidden=true,300)},2200)}
function sheet(eyebrow,title,body){$('#sheetIn').innerHTML=`<div class="grab"></div><div class="sh-head"><div><div class="eyebrow">${eyebrow}</div><h2>${title}</h2></div><button class="x" id="xBtn" aria-label="닫기">×</button></div>${body}`;
  $('#sheet').hidden=false;$('#joy').style.visibility='hidden';$('#xBtn').onclick=closeSheet;$('#sheetIn').scrollTop=0;barKey=''}
function closeSheet(){if($('#sheet').hidden)return;$('#sheet').hidden=true;$('#joy').style.visibility='';barKey='';if(!entered)$('#entry').hidden=false;canvas.focus({preventScroll:true})}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const priceHTML=p=>`<div class="pr won">${p.list>p.sell?`<em>${off(p)}%</em>`:''}<strong>${won(p.sell)}</strong>${p.list>p.sell?`<s>${won(p.list)}</s>`:''}</div>`;
const NOTE='<p class="note">구매하기를 누르면 WBL 공식몰 상품 페이지가 새 탭에서 열리고, 결제는 공식몰에서 진행돼요. 가격은 11월 5일 공식몰 기준이며 바뀔 수 있어요. 주얼패치는 전국 올리브영·오프뷰티 매장에서도 만날 수 있어요.</p>';
const card=p=>{const tag=(p.name.match(/^\[([^\]]+)\]/)||[])[1];const nm=p.name.replace(/^\[[^\]]+\]\s*/,'');
  return `<div class="item"><a class="im" href="${SHOP+p.no}" target="_blank" rel="noopener"><img src="${p.th}" alt="${esc(nm)} 상품 사진" loading="lazy"></a>${tag?`<span class="tag">${esc(tag)}</span>`:''}<b>${esc(nm)}</b>${priceHTML(p)}<a class="buy" href="${SHOP+p.no}" target="_blank" rel="noopener">구매하기</a></div>`};
let curTab='all';
function openShop(tab){curTab=tab||curTab||'all';const tabs=[{id:'all',name:'전체',n:ITEMS.length},...STYLES.map(s=>({id:s.id,name:s.name,n:byStyle(s.id).length}))];
  const groups=curTab==='all'?STYLES:STYLES.filter(s=>s.id===curTab);
  sheet('Jewelpatch Collection',`스타일별 주얼패치 ${ITEMS.length}종`,`<div class="tabs" role="tablist">${tabs.map(t=>`<button role="tab" aria-selected="${t.id===curTab}" data-tab="${t.id}">${t.name}<span>${t.n}</span></button>`).join('')}</div>
    ${groups.map(s=>`<section class="grp"><div class="gh"><span class="dot" style="background:${s.tone}"></span><h3>${s.name}</h3><small>${s.en} · ${byStyle(s.id).length}종</small>${entered&&curTab!=='all'?'':''}</div><p class="gd">${s.desc}</p>
      <div class="list">${byStyle(s.id).map(card).join('')}</div>${entered?`<button class="more go-ped" data-go="${s.id}">정원에서 ${s.name} 받침대로 가기</button>`:''}</section>`).join('')}${NOTE}`);
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>openShop(b.dataset.tab));
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{closeSheet();walkTo(PEDS.find(q=>q.p.id===b.dataset.go))})}
function openProduct(id){openShop(id)}
$('#shopBtn').onclick=()=>{$('#entry').hidden=true;openShop('all')};
$('#heartBtn').onclick=()=>{if(!entered)return;myHeart=Date.now();popHeart(player);sendPresence()};

/* ---------- entry ---------- */
function showEntry(){const sw=$('#sw');sw.innerHTML=COLORS.map((c,i)=>`<button type="button" style="background:${c}" data-c="${i}" aria-label="색 ${i+1}" aria-pressed="${i===me.color}"></button>`).join('');
  sw.querySelectorAll('button').forEach(b=>b.onclick=()=>{me.color=+b.dataset.c;sw.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b))});$('#nick').value=me.name;$('#entry').hidden=false}
$('#skipBtn').onclick=()=>{$('#entry').hidden=true;openShop('all')};
$('#entryForm').addEventListener('submit',e=>{e.preventDefault();me.name=$('#nick').value.trim().slice(0,10)||'반짝이는 귀';store.set('name',me.name);store.set('color',me.color);
  if(player)scene.remove(player);player=makeAvatar(me.color,me.name,true);P.x=0;P.z=14.5;P.ry=Math.PI;camYaw=0;camPitch=0.3;
  $('#entry').hidden=true;entered=true;sentKey='';sendPresence();if(!ROOM)setVisitors(1,false);toast('스타일 받침대 앞에 서면 모아볼 수 있어요');canvas.focus({preventScroll:true})});
showEntry();camera.position.set(0,9,34);frame();
})();
